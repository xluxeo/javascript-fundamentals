<!DOCTYPE html>
<html lang="de">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Wetter App</title>
	<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
	<h1>Wetter App</h1>
	<h2 id="location"></h2>
	<div id="weather-info">
		<p id="temperature"></p>
		<div class="item-group">
			<img id="weather-icon" src="" alt="" class="icon is-hidden">
			<p id="description" data-grid-col="2"></p>
		</div>
		<div class="item-group" data-grid-col="3">
			<p id="windSpeed"></p>
			<p id="humidity"></p>
			<span id="country"></span>
		</div>
	</div>
	<label for="locationInput"></label>
	<input type="text" id="locationInput" placeholder="Trage eine Stadt ein">
	<button id="loadButton">Laden</button>
</div>
<script type="module" src="app.js"></script>
</body>
</html>
