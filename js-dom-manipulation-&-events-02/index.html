<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<title>Title</title>
	<link rel="stylesheet" href="styles.css">
</head>
<body>
<form>
	<fieldset class="c-delivery-addresses js-delivery-addresses">
		<legend>Meine Lieferadressen</legend>
	</fieldset>
	<fieldset>
		<legend>Lieferadresse</legend>
		<ul class="c-list-bare js-inputs">
			<li class="c-list-bare__item">
				<label for="firstname">Vorname</label>
				<input id="firstname" name="firstname" value="">
			</li>
			<li class="c-list-bare__item">
				<label for="lastname">Nachname</label>
				<input id="lastname" name="lastname" value="">
			</li>
			<li class="c-list-bare__item">
				<label for="streetNo">Straße, Hausnummer</label>
				<input id="streetNo" name="no" value="">
			</li>
			<li class="c-list-bare__item">
				<label for="zip">PLZ, </label>
				<label for="city">Stadt</label>
				<input id="zip" name="zip" value="">
				<input id="city" name="city" value="">
			</li>
		</ul>
	</fieldset>
</form>
<script src="script.js"></script>
</body>
</html>
